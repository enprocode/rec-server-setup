- name: install latest mysql
  become: true
  apt:
    force_apt_get: true
    name:
      - mariadb-server
      - mariadb-client
      - python3-mysql.connector
      - python3-mysqldb
      - python3-pymysql

- name: upgrade pip
  pip:
    name: pip
    executable: pip3
    state: latest

- name: Install PyMySQL
  pip:
    name:
      - pymysql
      - mysqlclient
      - pexpect
    state: latest
    executable: pip3

- name: systemctl enable --now mariadb
  become: true
  shell: |
    systemctl start mariadb
    systemctl enable mariadb

- name: Create Database
  become: true
  shell: |
    mysql -e "show databases;"
    mysql -e "CREATE DATABASE epgstation CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;"
    mysql -e "GRANT ALL ON epgstation.* TO epgstation@127.0.0.1 IDENTIFIED BY 'epgstation';"
    mysql -e "GRANT ALL ON epgstation.* TO epgstation@localhost IDENTIFIED BY 'epgstation';"
    mysql -e "SET GLOBAL expire_logs_days = 1;"
    mysql -e "show databases;"
